name: Abbild bauen

# Baut das fertige Abbild und legt es in der Registry ab.
# Gebaut wird ausschliesslich hier (GitHub) - auf dem Zielrechner wird nichts
# gebaut. Der Quelltext kommt festgeschrieben aus dem amtlichen Archiv; der Bau
# bricht ab, wenn die Ankerprüfung in scripts/anpassen.py nicht mehr passt.
#
# Der Bau dauert lange (Rust-Klangmaschine im Container). Zeitgrenze deshalb
# grosszügig.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  bauen:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write
    steps:
      - name: Quelltext holen
        uses: actions/checkout@v4

      - name: Bauwerkzeug einrichten
        uses: docker/setup-buildx-action@v3

      - name: An der Registry anmelden
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Abbild bauen und schieben
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/mekotools/opendaw:latest
            ghcr.io/mekotools/opendaw:${{ github.sha }}

      - name: Kennwerte melden
        run: |
          echo "Gebaut: ghcr.io/mekotools/opendaw:${{ github.sha }}"
          docker buildx imagetools inspect ghcr.io/mekotools/opendaw:latest || true
