name: Abbild bauen

# Baut das fertige Abbild und legt es in der Registry ab.
# Gebaut wird ausschliesslich hier (GitHub) - auf dem Zielrechner wird nichts
# gebaut. Der Quelltext kommt festgeschrieben aus dem amtlichen Archiv; der Bau
# bricht ab, wenn die Ankerprüfung in scripts/anpassen.py nicht mehr passt.
#
# Der Bau dauert lange (Rust-Klangmaschine im Container); die Zeitgrenze ist
# deshalb grosszuegig. Ausserdem drosselt Docker Hub anonyme Abrufe von
# geteilten Bauservern (HTTP 429) schon beim Aufloesen der Grundabbilder —
# deshalb wird bei Fehlschlag ein zweites Mal ueber den oeffentlichen Spiegel
# mirror.gcr.io gebaut (siehe Schritt unten).

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  bauen:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write
    steps:
      - name: Quelltext holen
        uses: actions/checkout@v4

      - name: Bauwerkzeug einrichten
        uses: docker/setup-buildx-action@v3
        # Treiber "docker": gebaut wird mit dem Baukasten des Läufers selbst.
        # Sonst müsste erst das Abbild moby/buildkit aus Docker Hub geholt
        # werden — genau das scheiterte bei geteilten Bauservern schon
        # mehrfach an einer Drosselung. Wir bauen nur für eine Plattform und
        # schieben nur, dafür genügt dieser Treiber.
        with:
          driver: docker

      - name: An der Registry anmelden
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Abbild bauen und schieben
        run: |
          set -u
          echo "== Versuch 1: amtliche Grundabbilder"
          if docker buildx build --push --platform linux/amd64 \
               --tag "ghcr.io/mekotools/opendaw:latest" \
               --tag "ghcr.io/mekotools/opendaw:${GITHUB_SHA}" .; then
            echo "Versuch 1 erfolgreich"; exit 0
          fi
          echo "== Versuch 1 fehlgeschlagen (haeufigste Ursache: Docker-Hub-Drosselung 429)"
          echo "== Versuch 2: ueber den oeffentlichen Spiegel mirror.gcr.io"
          docker buildx build --push --platform linux/amd64 \
            --build-arg BASIS_NODE=mirror.gcr.io/library/node:24-bookworm \
            --build-arg BASIS_NGINX=mirror.gcr.io/library/nginx:alpine-slim \
            --tag "ghcr.io/mekotools/opendaw:latest" \
            --tag "ghcr.io/mekotools/opendaw:${GITHUB_SHA}" .

      - name: Kennwerte melden
        run: |
          echo "Gebaut: ghcr.io/mekotools/opendaw:${{ github.sha }}"
          docker buildx imagetools inspect ghcr.io/mekotools/opendaw:latest || true
