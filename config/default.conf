# Auslieferung: statische Dateien (eine Seite) hinter nginx.
#
# - Die Anwendung ist eine einzige index.html; alle übrigen Wege zeigen darauf.
# - Startseite und Verzeichnis der Klänge dürfen NICHT zwischengespeichert
#   werden, sonst bleibt nach einer neuen Fassung die alte liegen.
# - Kreuzherkunft-Isolation (COOP/COEP) braucht die Klangmaschine: sie arbeitet
#   mit gemeinsamem Speicher (SharedArrayBuffer) in einem Worker.
# - Content-Security-Policy verbietet Fremdaufrufe. Sie erlaubt genau das, was
#   das Werkzeug braucht: eigene Dateien, WebAssembly ('wasm-unsafe-eval'),
#   Blob- und Daten-Adressen (Worker, FFmpeg im Browser) — und sonst nichts.
#   connect-src 'self' heisst: kein Server ausser unserem eigenen.
# - ACHTUNG, nginx-Falle: eine eigene add_header-Zeile in einem location-Block
#   SCHALTET die geerbten add_header-Zeilen ab. Deshalb hier kein add_header in
#   den locations — sonst fällt die CSP genau auf der Startseite weg.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/wasm image/svg+xml text/javascript;

    # Klangmaschine braucht gemeinsamen Speicher -> Kreuzherkunft-Isolation.
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' blob:; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' data: blob:; connect-src 'self' blob: data:; font-src 'self' data:; frame-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    location = /gesundheit {
        return 200 "ok\n";
    }

    # Startseite, Verzeichnis der Klänge und Sponsorendatei: immer beim Server fragen.
    location = /index.html {
        expires -1;
    }

    location = /library/index.json {
        expires -1;
    }

    location = /sponsors.json {
        expires -1;
    }

    # Gehashte Bündel-Dateien: ein Jahr zwischenspeichern ist unbedenklich.
    location ~* ^/assets/ {
        expires 1y;
    }

    # Klänge (unveränderliche Kennungen) und der FFmpeg-Kern: lange zwischenspeichern.
    location ~* ^/(library/[0-9a-f-]{36}|ffmpeg/ffmpeg-core\.(js|wasm))$ {
        expires 30d;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
