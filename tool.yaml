# Metadaten des MekoTools-Werkzeugs "openDAW".
# Schema: schema/tool.schema.json im Katalog-Repo. Werte ohne Beleg werden
# nicht eingetragen. Die id ist stabil und wird nie umbenannt.

schema_version: 1

id: mekotools-opendaw
titel: openDAW
kurzbeschreibung: 'Ein vollständiges Musikstudio im Browser: Schlagzeug programmieren, Klänge und Aufnahmen auf Spuren legen, mischen und ein Stück als Datei sichern — ohne Konto. Die mitgelieferten Klänge sind freie Aufnahmen und liegen auf dem eigenen Server.'
themen: [creation]
unterthemen: [creation/audio]
stufe: 3
schlagworte: [ton]

laufzeit: browser
betrieb: eigen
reifegrad: beta
aufwand_lehrkraft: mittel

zielgruppe: [sek1, sek2]
geraete: [desktop, tablet]
kamera: nein
mikrofon: optional

bildungsbezug:
  kompetenzen:
    - produzieren-praesentieren
    - analysieren-reflektieren
    - problemloesen-handeln
  faecher: [musik, kunst, informatik]
  lernziele:
    - Ein kurzes Stück aus Schlagzeug, Bass und Melodie auf mehreren Spuren zusammenstellen
    - Die Wirkung von Tempo, Lautstärke und Klangfarbe in eigenen Worten beschreiben und im Werkzeug erproben
    - Ein fertiges Stück als Datei sichern und wieder öffnen

technik:
  artefakte:
    - typ: image
      referenz: ghcr.io/mekotools/opendaw:latest
      sichtbarkeit: public
      geprueft_am: '2026-10-09'
  dienst_url: https://opendaw.mekotools.de
  port: 80
  quellcode: https://github.com/andremichelle/openDAW
  lizenz: AGPL-3.0
  lizenz_link: https://github.com/andremichelle/openDAW/blob/main/LICENSE
  hinweis: 'Eigene Auslieferung: Die Klangbibliothek des Anbieters (gekaufte Paketware) kommt nicht mit. Mitgeliefert werden 51 freie Klänge (CC0). Live-Räume, Demo-Stücke, Plugin-Katalog, Klangtrennung und Speichern in fremden Cloud-Diensten sind abgeschaltet.'
  sprache: 'Oberfläche englisch (Original); Anleitung, Didaktik und Unterrichtsentwurf auf Deutsch'

doku:
  anleitung: docs/anleitung.md
  didaktik: docs/didaktik.md
  unterrichtsentwurf: docs/unterrichtsentwurf.md

stand: '2026-10-09'
